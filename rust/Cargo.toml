[workspace]
resolver = "2"
members = ["tablemaker-dsp", "tablemaker-synth", "tablemaker-app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
rustfft = "6"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
clap = { version = "4", features = ["derive"] }
cpal = "0.18"
midir = "0.11"
rtrb = "0.4"
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "wgpu", "wayland", "x11"] }
rfd = "0.18"
# Only to choose X11 (XWayland) over Wayland: winit's Wayland backend has no drag and drop.
winit = { version = "0.30", default-features = false, features = ["x11", "wayland"] }
tablemaker-dsp = { path = "tablemaker-dsp" }
tablemaker-synth = { path = "tablemaker-synth" }

# Oversampling, pitch tracking and cycle rendering are heavy number crunching:
# unoptimised, a few seconds of audio takes minutes (and so do the tests).
# Optimised even in development builds; the rest stays quick to build.
[profile.dev.package.tablemaker-dsp]
opt-level = 3
debug-assertions = false
overflow-checks = false

# The synth renders in real time: unoptimised it misses its deadlines.
[profile.dev.package.tablemaker-synth]
opt-level = 3
debug-assertions = false
overflow-checks = false

[profile.dev.package.rustfft]
opt-level = 3
